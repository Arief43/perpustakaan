<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Perpustakaan Ilmu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: aplikasi pustaka audio — bar atas + sidebar "Rak Saya" + panel utama (hero gradient + rak mendatar) + bar "Sedang dibaca" di bawah. Gelap sahaja, warna diset eksplisit. */
:root{
  --bg:#000000; --panel:#121212; --raised:#1F1F1F; --raised2:#2A2A2A; --ink:#FFFFFF; --muted:#B3B3B3; --dim:#6A6A6A;
  --accent:#5B7CFF; --accent-ink:#06081A; --ok:#5B7CFF; --warn:#C9A2FF; --bad:#7A7A7A;
  --hero1:#3B1E8F; --hero2:#1A1450;
  --f-ui:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif; --f-cover:"DM Serif Display",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;margin:0;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{display:block}

.app{height:100%;display:grid;grid-template-columns:320px minmax(0,1fr);grid-template-rows:64px minmax(0,1fr) 76px;gap:8px;padding-block:0 8px}
/* Bar atas */
.top{grid-column:1/-1;display:grid;grid-template-columns:1fr minmax(0,560px) 1fr;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;padding-left:8px}
.brand i{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-style:normal;font-family:var(--f-cover);font-size:18px}
.mid{display:flex;align-items:center;gap:8px}
.homebtn{width:48px;height:48px;border-radius:50%;background:var(--raised);display:grid;place-items:center;flex:0 0 auto}
.homebtn:hover{background:var(--raised2);transform:scale(1.04)}
.sbox{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--raised);border-radius:999px;height:48px;padding:0 16px;border:1px solid transparent}
.sbox:hover,.sbox:focus-within{background:var(--raised2);border-color:#3a3a3a}
.sbox input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;font-size:16px;outline:none}
.sbox input::placeholder{color:var(--muted)}
.right{display:flex;justify-content:flex-end;gap:10px;align-items:center;padding-right:8px}
.pill{font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900}

/* Sidebar */
.side{background:var(--panel);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.side-h{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 8px}
.side-h h2{margin:0;font-size:16px;font-weight:800;display:flex;align-items:center;gap:10px;color:var(--muted)}
.side-h h2 svg{color:var(--muted)}
.chips{display:flex;gap:8px;padding:8px 16px;flex-wrap:wrap}
.chip{background:var(--raised);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500}
.chip:hover{background:var(--raised2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.side-tools{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 4px;color:var(--muted);font-size:14px}
.list{overflow-y:auto;padding:4px 8px 12px;flex:1;min-height:0;scrollbar-width:thin;scrollbar-color:#444 transparent}
.li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;padding:8px;border-radius:6px;width:100%;text-align:left}
.li:hover{background:var(--raised)}
.li.on{background:var(--raised2)}
.li .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.on .t{color:var(--accent)}
.li .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb{width:48px;height:48px;border-radius:4px;object-fit:cover;background:var(--raised2)}

/* Panel utama */
.main{background:var(--panel);border-radius:10px;overflow-y:auto;min-height:0;position:relative;scrollbar-width:thin;scrollbar-color:#444 transparent}
.hero{background:linear-gradient(180deg,var(--hero1) 0%,var(--hero2) 55%,var(--panel) 100%);padding:56px 24px 28px}
.hero h1{margin:0;font-size:clamp(48px,8.4vw,104px);font-weight:900;letter-spacing:-.04em;line-height:.95}
.hero p{margin:14px 0 0;color:#D9D6F5;font-size:14px;font-weight:500}
.shelves{padding:4px 24px 32px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.shelves>section{min-width:0}
.shelf-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.shelf-h h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
.shelf-h button{color:var(--muted);font-size:14px;font-weight:700}
.shelf-h button:hover{color:var(--ink);text-decoration:underline}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,184px);gap:4px;overflow-x:auto;margin:0 -12px;padding:0 0 6px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px;margin:0 -12px}
.card{padding:12px;border-radius:8px;text-align:left;display:grid;gap:8px;align-content:start;position:relative}
.card:hover{background:var(--raised)}
.cover{position:relative;aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:var(--raised2);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ct{position:absolute;left:0;right:0;bottom:0;padding:28px 10px 10px;background:linear-gradient(180deg,transparent,rgba(5,3,20,.88));font-family:var(--f-cover);font-size:19px;line-height:1.05;text-shadow:0 2px 8px rgba(0,0,0,.6);text-wrap:balance}
.cover .tg{position:absolute;top:8px;left:8px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.55);padding:3px 7px;border-radius:4px;backdrop-filter:blur(4px)}
.play{position:absolute;right:20px;top:calc(12px + (100% - 120px) * 0);width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 16px rgba(0,0,0,.4);opacity:0;transform:translateY(8px);transition:all .2s ease}
.card:hover .play,.card:focus-visible .play{opacity:1;transform:none}
.card .nm{font-weight:700;font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .by{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-4px}
.card .lv{font-size:13px;color:var(--accent);font-weight:500;margin-top:-6px}
.card .lv.warn{color:var(--warn)} .card .lv.bad{color:var(--dim)}
.qcover{display:grid;place-items:center;font-family:var(--f-cover);font-size:56px;color:rgba(255,255,255,.92)}
.qcover small{position:absolute;bottom:10px;left:10px;right:10px;font-family:var(--f-ui);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.backbtn{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:700;font-size:14px;margin-bottom:12px}
.backbtn:hover{color:var(--ink)}
.empty{color:var(--muted);padding:24px 0}

/* Bar bawah */
.player{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:16px;padding:0 8px}
.np{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;min-width:0}
.np img,.np .thumb{width:56px;height:56px;border-radius:4px;object-fit:cover}
.np .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl{display:grid;gap:6px;justify-items:center}
.btns{display:flex;align-items:center;gap:20px}
.btns .sm{color:var(--muted)} .btns .sm:hover{color:var(--ink)}
.big{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.big:hover{transform:scale(1.06)}
.big[aria-disabled="true"]{opacity:.4;cursor:default;transform:none}
.bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:4px;background:#4D4D4D;border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;background:var(--ink);border-radius:2px}
.extra{display:flex;justify-content:flex-end;gap:10px}
.ghost{border:1px solid #7A7A7A;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;white-space:nowrap}
.ghost:hover{border-color:var(--ink);transform:scale(1.03)}

/* Panel ringkasan */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);z-index:41;overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) 20px}
.d-hero{display:grid;grid-template-columns:140px minmax(0,1fr);gap:16px;align-items:end;margin:8px 0 20px}
.d-hero .cover{box-shadow:0 12px 40px rgba(0,0,0,.6)}
.d-hero .k{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.d-hero h2{margin:4px 0;font-size:30px;font-weight:900;line-height:1;letter-spacing:-.02em;text-wrap:balance}
.d-hero .by{color:var(--muted);font-size:14px}
.d-close{display:flex;justify-content:flex-end}
.d-close button{width:36px;height:36px;border-radius:50%;background:var(--raised);display:grid;place-items:center}
.d-act{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:999px;padding:12px 22px;text-decoration:none}
.cta:hover{transform:scale(1.03)}
.cta.off{background:var(--raised2);color:var(--muted);cursor:default;transform:none}
.sec{margin-bottom:20px}
.sec h4{margin:0 0 8px;font-size:16px;font-weight:800}
.sec p{margin:0;color:#DADADA}
.sec ul{margin:0;padding-left:18px;color:#DADADA;display:grid;gap:6px}
.prompt{background:var(--raised);border-radius:8px;padding:12px;font-size:13.5px;color:#DADADA;user-select:all;white-space:pre-wrap}
.sb{position:absolute;top:8px;right:8px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:4px;background:var(--accent);color:var(--accent-ink)}
.sb.sedang{background:var(--warn);color:#1A0B2E}
.studybar{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap;font-size:14px;font-weight:700;color:#D9D6F5;font-variant-numeric:tabular-nums}
.studybar .track{width:min(240px,60%);height:6px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
.studybar .track i{display:block;height:100%;background:var(--accent)}
.studybar .track i+i{background:var(--warn)}
.studybar .track{display:flex}
.seg{display:inline-flex;background:var(--raised);border-radius:999px;padding:4px;gap:4px;margin-bottom:18px}
.seg button{padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button[aria-pressed="true"][data-s="dah"]{background:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"][data-s="sedang"]{background:var(--warn);color:#1A0B2E}
.li .s b{color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 18px;border-radius:8px;z-index:60}

@media (max-width:900px){
  html,body{height:auto}
  .app{display:block;padding-bottom:96px}
  .top{display:flex;padding-block:10px;gap:8px;min-width:0}
  .brand,.right{display:none}
  .mid{flex:1;min-width:0}
  .homebtn{width:44px;height:44px}
  .sbox{height:44px}
  .sbox input{width:100%;font-size:15px}
  .side,.main,.player{min-width:0}
  .hero h1{font-size:clamp(40px,12vw,64px);overflow-wrap:anywhere}
  .side{margin:8px 0;border-radius:10px}
  .list{display:none}
  .side-tools{display:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:12px}
  .main{overflow:visible}
  .hero{padding:36px 16px 20px}
  .shelves{padding:4px 16px 24px}
  .player{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);background:#1B1540;border-radius:10px;padding:8px 10px;grid-template-columns:minmax(0,1fr) auto;z-index:30}
  .ctrl .bar,.btns .sm{display:none}
  .extra{display:none}
  .np img,.np .thumb{width:44px;height:44px}
  .np{grid-template-columns:44px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.play,.cta,.big,.ghost{transition:none}}
</style>
</head>

<script>
(function(){
  const D=JSON.parse(document.getElementById('data').textContent);
  const items=D.items.slice().sort((a,b)=>b.tarikh.localeCompare(a.tarikh));
  const queue=D.giliran.flatMap((g,gi)=>g.rows.map(r=>({code:r[0],tajuk:r[1],saiz:r[2],kumpulan:g.kumpulan,gi})));
  const $=s=>document.querySelector(s);
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const JENIS={kursus:'Kursus',video:'Video',buku:'Buku'};
  const NILAI={ok:'Wajib baca',warn:'Ambil sebahagian',bad:'Langkau'};
  const QHUE=[['#4A2A8C','#1D1446'],['#1E3A8A','#0E1A40'],['#6B2A5E','#2A1030']];
  const SHELVES=[
    {k:'kursus',h:'Kursus siap',f:i=>i.jenis==='kursus'},
    {k:'iklan',h:'Iklan & Google Ads',f:i=>i.topik.includes('Iklan')},
    {k:'seo',h:'SEO',f:i=>i.topik.includes('SEO')},
    {k:'ai',h:'Claude Code & AI',f:i=>i.topik.includes('Claude Code & AI')},
    {k:'bisnes',h:'Bisnes, Growth & Produk',f:i=>i.topik.some(t=>['Bisnes & Strategi','Growth','Produk & App'].includes(t))},
    {k:'video',h:'Video AI & Design',f:i=>i.topik.some(t=>['Video AI','Design'].includes(t))},
    {k:'buku',h:'Buku & produktiviti',f:i=>i.jenis==='buku'},
    {k:'vid',h:'Semua video',f:i=>i.jenis==='video',hide:true},
  ];
  const st={q:'',chip:'Semua',view:'home',cur:items[0]};
  // Status study: disimpan dalam pelayar ini sahaja (localStorage). Tak sama antara peranti.
  let STUDY={};try{STUDY=JSON.parse(localStorage.getItem('pi2-study')||'{}')||{}}catch(e){STUDY={}}
  const ss=i=>STUDY[i.id]||'belum';
  const SLBL={belum:'Belum',sedang:'Sedang',dah:'Dah study'};
  function setStudy(i,v){if(v==='belum')delete STUDY[i.id];else STUDY[i.id]=v;try{localStorage.setItem('pi2-study',JSON.stringify(STUDY))}catch(e){toast('Pelayar ini tak benarkan simpan tanda')}
    renderMain();renderList();renderPlayer();if(!drawer.hidden)openD(i,true);toast(i.tajuk+': '+SLBL[v])}
  function studyText(){const g=v=>items.filter(i=>ss(i)===v).map(i=>`- ${i.id} ${i.tajuk}`).join('\n')||'- (tiada)';
    return `Jarvis, ini status study aku dalam Perpustakaan Ilmu (${new Date().toISOString().slice(0,10)}).\nDah study:\n${g('dah')}\nSedang:\n${g('sedang')}\nBelum:\n${g('belum')}\nCadang apa patut aku study seterusnya ikut Pelan Induk.`}
  try{const s=localStorage.getItem('pi2-cur');const f=items.find(i=>i.id===s);if(f)st.cur=f}catch(e){}
  const lamanUrl=i=>(i.laman||[]).find(l=>/^https:/.test(l.url));
  const hasLaman=i=>!!lamanUrl(i);

  $('#countpill').textContent=`${items.length} tajuk · ${queue.length} giliran`;

  function cover(i,{tag=true,title=true}={}){
    const b=tag&&ss(i)!=='belum'?`<span class="sb ${ss(i)}">${SLBL[ss(i)]}</span>`:'';
    return `<div class="cover"><img src="${esc(i.kulit)}" alt="" loading="lazy">${tag?`<span class="tg">${JENIS[i.jenis]}</span>`:''}${b}${title?`<div class="ct">${esc(i.tajuk)}</div>`:''}</div>`;
  }
  function qcover(q){const [a,b]=QHUE[q.gi%3];return `<div class="cover qcover" style="background:linear-gradient(145deg,${a},${b})">${esc(q.code)}<small>Akan datang</small></div>`}
  function card(i){return `<button class="card" type="button" data-id="${i.id}">${cover(i)}
      <span class="play" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg></span>
      <span class="nm">${esc(i.tajuk)}</span><span class="by">${esc(i.pengajar)}</span><span class="lv ${i.nilai}">${NILAI[i.nilai]}</span></button>`}
  function qcard(q){return `<button class="card" type="button" data-q="${esc(q.code)}">${qcover(q)}<span class="nm">${esc(q.tajuk)}</span><span class="by">${esc(q.kumpulan.split('·')[1]||q.kumpulan)} · ${esc(q.saiz)}</span><span class="lv bad">Dalam giliran</span></button>`}

  function match(i){if(!st.q)return true;return [i.tajuk,i.pengajar,i.topik.join(' '),i.ringkasan,i.terap].join(' ').toLowerCase().includes(st.q)}
  function qmatch(q){return !st.q||(q.tajuk+' '+q.kumpulan).toLowerCase().includes(st.q)}

  function renderMain(){
    const m=$('#main');
    if(st.view==='home'){
      let html=`<section class="hero"><h1>Perpustakaan Ilmu</h1><p>${items.length} tajuk ditranskrip dan diringkaskan · ${queue.length} kursus dalam giliran · dikemas kini ${esc(D.dikemaskini)}</p><p style="margin-top:16px"><a class="cta" href="https://claude.ai/artifact/VNpr1ecHYpAxREgEeLVt4y" target="_blank" rel="noopener">Buka Pelan Induk ↗</a></p>${(()=>{const d=items.filter(i=>ss(i)==='dah').length,g=items.filter(i=>ss(i)==='sedang').length,n=items.length;
        return `<div class="studybar"><span>${d} / ${n} dah study${g?` · ${g} sedang`:''}</span><span class="track" aria-hidden="true"><i style="width:${(d/n*100).toFixed(1)}%"></i><i style="width:${(g/n*100).toFixed(1)}%"></i></span><button class="ghost" type="button" data-studycopy>Salin status untuk Jarvis</button></div>`})()}</section><div class="shelves">`;
      let any=false;
      const sedang=items.filter(i=>ss(i)==='sedang').filter(match);
      if(sedang.length){any=true;html+=`<section><div class="shelf-h"><h2>Sambung study</h2></div><div class="row">${sedang.map(card).join('')}</div></section>`}
      const belum=items.filter(i=>ss(i)==='belum'&&i.nilai==='ok').filter(match);
      if(belum.length){any=true;html+=`<section><div class="shelf-h"><h2>Belum study · wajib baca</h2><button type="button" data-all="belum">Lihat semua</button></div><div class="row">${belum.map(card).join('')}</div></section>`}
      SHELVES.filter(s=>!s.hide).forEach(s=>{const l=items.filter(s.f).filter(match);if(!l.length)return;any=true;
        html+=`<section><div class="shelf-h"><h2>${s.h}</h2><button type="button" data-all="${s.k}">Lihat semua</button></div><div class="row">${l.map(card).join('')}</div></section>`});
      const ql=queue.filter(qmatch);
      if(ql.length){any=true;html+=`<section><div class="shelf-h"><h2>Dalam giliran transkrip</h2><button type="button" data-all="giliran">Lihat semua</button></div><div class="row">${ql.map(qcard).join('')}</div></section>`}
      if(!any)html+=`<p class="empty">Tiada tajuk untuk "${esc(st.q)}". Cuba perkataan lain.</p>`;
      m.innerHTML=html+'</div>';
    }else{
      const s=st.view==='belum'?{h:'Belum study',f:i=>ss(i)==='belum'}:SHELVES.find(x=>x.k===st.view);
      const body=st.view==='giliran'?queue.filter(qmatch).map(qcard).join(''):items.filter(s.f).filter(match).map(card).join('');
      m.innerHTML=`<section class="hero" style="padding-bottom:20px"><button class="backbtn" type="button" data-back>← Kembali</button><h1 style="font-size:clamp(40px,6vw,72px)">${st.view==='giliran'?'Dalam giliran':s.h}</h1></section><div class="shelves"><div class="grid">${body||'<p class="empty">Tiada tajuk.</p>'}</div></div>`;
    }
    m.scrollTop=0;
  }

  const CHIPS=['Semua','Belum study','Kursus','Video','Buku','Giliran'];
  $('#chips').innerHTML=CHIPS.map(c=>`<button class="chip" type="button" data-c="${c}" aria-pressed="${c===st.chip}">${c}</button>`).join('');
  function renderList(){
    let html='';
    if(st.chip==='Giliran'){html=queue.filter(qmatch).map(q=>`<button class="li" type="button" data-q="${esc(q.code)}"><span class="thumb" style="display:grid;place-items:center;font-family:var(--f-cover);background:linear-gradient(145deg,${QHUE[q.gi%3][0]},${QHUE[q.gi%3][1]})">${esc(q.code)}</span><span style="min-width:0"><div class="t">${esc(q.tajuk)}</div><div class="s">Giliran • ${esc(q.saiz)}</div></span></button>`).join('')}
    else{const l=items.filter(i=>st.chip==='Semua'||(st.chip==='Belum study'?ss(i)!=='dah':JENIS[i.jenis]===st.chip)).filter(match);
      html=l.map(i=>`<button class="li${st.cur&&st.cur.id===i.id?' on':''}" type="button" data-id="${i.id}"><img class="thumb" src="${esc(i.kulit)}" alt=""><span style="min-width:0"><div class="t">${esc(i.tajuk)}</div><div class="s">${ss(i)!=='belum'?`<b>${SLBL[ss(i)]}</b> • `:''}${JENIS[i.jenis]} • ${esc(i.pengajar)}</div></span></button>`).join('')}
    $('#list').innerHTML=html||'<p class="empty" style="padding:8px">Tiada tajuk.</p>';
  }
  function renderPlayer(){
    const i=st.cur;const idx=items.indexOf(i);const u=lamanUrl(i);
    $('#player').innerHTML=`<div class="np"><img src="${esc(i.kulit)}" alt=""><div style="min-width:0"><div class="t">${esc(i.tajuk)}</div><div class="s">${JENIS[i.jenis]} • ${esc(i.pengajar)}</div></div></div>
      <div class="ctrl"><div class="btns">
        <button class="sm" type="button" data-step="-1" aria-label="Tajuk sebelum"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zm3 7 10-7v14z"/></svg></button>
        ${u?`<a class="big" href="${esc(u.url)}" target="_blank" rel="noopener" aria-label="Buka laman"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg></a>`
           :`<button class="big" type="button" data-open aria-label="Baca ringkasan"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg></button>`}
        <button class="sm" type="button" data-step="1" aria-label="Tajuk seterusnya"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM5 5l10 7-10 7z"/></svg></button></div>
        <div class="bar"><span>${idx+1}</span><span class="track"><i style="width:${((idx+1)/items.length*100).toFixed(1)}%"></i></span><span>${items.length}</span></div></div>
      <div class="extra"><button class="ghost" type="button" data-study="${ss(i)==='dah'?'belum':'dah'}">${ss(i)==='dah'?'✓ Dah study':'Tanda dah study'}</button><button class="ghost" type="button" data-open>Ringkasan</button><button class="ghost" type="button" data-copy>Salin prompt Jarvis</button></div>`;
  }
  function setCur(i){st.cur=i;try{localStorage.setItem('pi2-cur',i.id)}catch(e){};renderPlayer();renderList()}

  const drawer=$('#drawer'),scrim=$('#scrim');let lastF=null;
  const prompt=i=>`Jarvis, aku baru baca ringkasan "${i.tajuk}" (${i.pengajar}) dalam Perpustakaan Ilmu. Jom bincang macam mana nak terapkan dalam bisnes kita, terutama ${i.terap}.${i.vault?' Rujuk [['+i.vault+']] dalam vault.':''}`;
  function openD(i,keep){setCur(i);if(!keep)lastF=document.activeElement;
    const links=(i.laman||[]).map(l=>/^https:/.test(l.url)?`<a class="cta" href="${esc(l.url)}" target="_blank" rel="noopener">▶ ${esc(l.label)}</a>`:`<span class="cta off">${esc(l.label)}: belum terbit</span>`).join('');
    const src=i.sumber?`<a class="ghost" href="${esc(i.sumber)}" target="_blank" rel="noopener" style="text-decoration:none">Tonton sumber ↗</a>`:'';
    drawer.innerHTML=`<div class="d-close"><button type="button" id="d-x" aria-label="Tutup">✕</button></div>
      <div class="d-hero">${cover(i,{tag:false,title:false})}<div><div class="k">${JENIS[i.jenis]} · ${i.id}</div><h2 id="d-title">${esc(i.tajuk)}</h2><div class="by">${esc(i.pengajar)} · ${esc(i.saiz)} · ${esc(i.tarikh)}</div></div></div>
      <div class="seg" role="group" aria-label="Status study">${['belum','sedang','dah'].map(v=>`<button type="button" data-s="${v}" data-study="${v}" aria-pressed="${ss(i)===v}">${SLBL[v]}</button>`).join('')}</div>
      <div class="d-act">${links}${src}<button class="ghost" type="button" data-copy>Salin prompt Jarvis</button></div>
      <div class="sec"><h4>Ringkasan</h4><p>${esc(i.ringkasan)}</p></div>
      <div class="sec"><h4>Intipati</h4><ul>${i.intipati.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
      <div class="sec"><h4>Terap untuk</h4><p>${esc(i.terap)}</p></div>
      <div class="sec"><h4>Nilai</h4><p>${NILAI[i.nilai]}</p></div>
      <div class="sec"><h4>Bincang dengan Jarvis</h4><div class="prompt" id="d-prompt">${esc(prompt(i))}</div></div>`;
    drawer.hidden=false;scrim.hidden=false;if(!keep)$('#d-x').focus();$('#d-x').onclick=closeD}
  function closeD(){drawer.hidden=true;scrim.hidden=true;if(lastF)lastF.focus()}
  scrim.onclick=closeD;
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!drawer.hidden)closeD()});
  let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}
  function copy(){const t=prompt(st.cur);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Prompt disalin. Tampal kepada Jarvis.')).catch(()=>{openD(st.cur);const r=document.createRange();r.selectNodeContents($('#d-prompt'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Teks dipilih, tekan salin')})}

  document.addEventListener('click',e=>{
    const t=e.target;
    const sb=t.closest('[data-study]');if(sb){setStudy(st.cur,sb.dataset.study);return}
    if(t.closest('[data-studycopy]')){const x=studyText();(navigator.clipboard?navigator.clipboard.writeText(x):Promise.reject()).then(()=>toast('Status disalin. Tampal kepada Jarvis.')).catch(()=>toast('Tak dapat salin di pelayar ini'));return}
    const c=t.closest('[data-id]');if(c){openD(items.find(i=>i.id===c.dataset.id));return}
    const q=t.closest('[data-q]');if(q){toast(q.dataset.q+' belum ditranskrip. Ia akan muncul di rak bila siap.');return}
    const a=t.closest('[data-all]');if(a){st.view=a.dataset.all;renderMain();return}
    if(t.closest('[data-back]')||t.closest('#home')){st.view='home';renderMain();return}
    const sp=t.closest('[data-step]');if(sp){const n=items.length;setCur(items[(items.indexOf(st.cur)+(+sp.dataset.step)+n)%n]);return}
    if(t.closest('[data-open]')){openD(st.cur);return}
    if(t.closest('[data-copy]')){copy();return}
    const ch=t.closest('.chip');if(ch){st.chip=ch.dataset.c;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===ch));renderList();
      if(window.matchMedia('(max-width:900px)').matches){st.view={Kursus:'kursus',Video:'vid',Buku:'buku',Giliran:'giliran','Belum study':'belum'}[st.chip]||'home';renderMain()}return}
  });
  $('#q').addEventListener('input',e=>{st.q=e.target.value.trim().toLowerCase();renderMain();renderList()});

  renderMain();renderList();renderPlayer();
})();
</script>
